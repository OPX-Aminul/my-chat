name: Build & Release Android APK

# Every push to main that changes app code → build APK → create a release.
# Release tag auto-increments: v1.0.0 → v1.0.1 → v1.0.2 → …
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck (non-blocking)
        run: bunx tsc -b --noEmit || echo "typecheck warnings — continuing release"

      - name: Build web assets
        run: bun run build

      - name: Determine next version tag
        id: ver
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            NEXT="v1.0.0"
          else
            # strip leading v, bump patch
            V=${LAST_TAG#v}
            MAJOR=$(echo "$V" | cut -d. -f1)
            MINOR=$(echo "$V" | cut -d. -f2)
            PATCH=$(echo "$V" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEXT="v$MAJOR.$MINOR.$PATCH"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next release: $NEXT"

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync web assets into Android
        run: bunx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK (signed with debug key — installable)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk "apks/MyChat24-${{ steps.ver.outputs.tag }}.apk"

      - name: Create/update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: My Chat 24 ${{ steps.ver.outputs.tag }}
          body: |
            ## My Chat 24 ${{ steps.ver.outputs.tag }} 🚀

            **Android APK** — download `MyChat24-${{ steps.ver.outputs.tag }}.apk` below and install it
            (enable "Install from unknown sources" on your phone).

            ### What's inside
            - Realtime 1:1 chat, groups & channels
            - 24-hour stories with view tracking
            - Audio & video calls (WebRTC + Cloudflare TURN)
            - Contacts sync, profiles, admin panel

            _Auto-generated release — every push to `main` ships a fresh APK._
          files: apks/MyChat24-*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
